[project]
name = "jobpilot"
version = "0.1.0"
description = "Job application + referral tracker for junior devs"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "asyncpg==0.29.0",
    "pydantic>=2.7.4,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "python-dotenv==1.0.0",
    "google-generativeai==0.7.2",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langchain-google-genai>=4.2.0",
    "langchain-groq>=1.1.0",
    "langchain-core>=1.4.0",
    "langchain-ollama>=0.3.0",
    "langsmith>=0.8.0",
    "apscheduler==3.10.4",
    "alembic==1.13.1",
    "psycopg[binary]==3.2.1",
    "python-multipart>=0.0.9",
    "httpx>=0.28.1",
    "itsdangerous==2.2.0",
    "structlog==24.1.0",
    "prometheus-client==0.20.0",
    "sentry-sdk[fastapi]==2.5.1",
    "slowapi==0.1.9",
    # ATS Score Pro — document parsing + ML semantic layer
    "pdfminer.six>=20221105",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "nltk>=3.8.1",
    "rapidfuzz>=3.9.0",
    "gensim>=4.3.2",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "httpx>=0.28.1",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "pip-audit==2.7.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["app/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.mypy]
strict = true
files = ["app/services", "app/repositories", "app/routers", "app/models.py", "app/main.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require a live external service (Ollama, DB, etc.)",
]
filterwarnings = [
    "ignore:Please use `import python_multipart` instead.:PendingDeprecationWarning",
    "ignore:Type google\\._upb\\._message\\..*PyType_Spec.*:DeprecationWarning",
]
